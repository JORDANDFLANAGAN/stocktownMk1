[project]
name = "stocktown"
version = "0.0.1"
description = "Stocktown — 3D city visualisation of stock indices and portfolios"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "websockets>=13",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=8",
    "pytest-timeout>=2.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
# A test that hangs (e.g. awaiting a message that never comes) fails instead of blocking CI.
timeout = 10
